          - generic [ref=e23]:
            - heading "About Anthropic" [level=2] [ref=e24]:
              - strong [ref=e25]: About Anthropic
            - paragraph [ref=e26]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=e27]:
            - heading "About the role" [level=2] [ref=e28]:
              - strong [ref=e29]: About the role
            - paragraph [ref=e30]: A partner ecosystem is an important mechanism to ensure we train and enable customers to use and love Claude. The Head of Programmatic Outcomes (Partners) is responsible for shaping it — not as a standalone function, but as a focused sub-goal of Anthropic’s broader Partnerships strategy that no single existing team is positioned to own end-to-end. Anthropic already has Alliances, Sales, and a Partnerships org; this leader holds the connective tissue that turns those relationships into a reliable activation and enablement channel.
            - paragraph [ref=e31]: "This is not a traditional channel partnerships role. It's a programmatic activation and enablement role that operates through partners. The question is: how do you certify and equip consulting firms, SIs, MSPs, and technology partners to run the same activation motions your CSM team runs — at 10x the scale, without Anthropic headcount, with reliable quality via marketplace dynamics? You will shape the partner framework, the economics, the certification program, the enablement toolkit, and the feedback loop — co-building with the Partnerships org on economics and recruitment, with Product on tooling access, and with Growth Marketing on co-marketing — to make partner-led activation as reliable as direct-led. Success comes through influence and coordination, leveraging Anthropic’s existing partner relationships rather than duplicating them."
            - heading "Responsibilities:" [level=2] [ref=e32]:
              - strong [ref=e33]: "Responsibilities:"
            - list [ref=e34]:
              - listitem [ref=e35]:
                - paragraph [ref=e36]: Drive the Anthropic Certified Partner Program in close partnership with the Partnerships org — defining tiers, certification criteria, enablement curriculum, co-activation frameworks, and performance accountability standards that extend Anthropic’s existing partner infrastructure into an activation-ready ecosystem
              - listitem [ref=e37]:
                - paragraph [ref=e38]: Identify, recruit, and onboard the highest-leverage partners (SIs, consulting firms, MSPs, technology partners) for driving Tier C account AI adoption at scale — with a prioritized view of where ROI is highest fastest
              - listitem [ref=e39]:
                - paragraph [ref=e40]: "Co-develop the partner enablement toolkit with the Product and Growth Marketing capability leads: training content, activation playbooks, co-sell materials, and technical resources that allow certified partners to run Anthropic’s activation motion independently and consistently"
              - listitem [ref=e41]:
                - paragraph [ref=e42]: Design the partner feedback loop — mechanisms for capturing what works in partner-led activations, codifying learnings into updated playbooks, and surfacing insights back to the programmatic team
              - listitem [ref=e43]:
                - paragraph [ref=e44]: Collaborate with Product and Systems/Process capability leads to ensure partners have access to the right tools, telemetry, and infrastructure to manage their Tier C portfolio
              - listitem [ref=e45]:
                - paragraph [ref=e46]: "Establish partner performance metrics in partnership with Strat Ops: activation rates, adoption outcomes, revenue contribution from partner-influenced accounts, and partner health scoring for the ecosystem"
              - listitem [ref=e47]:
                - paragraph [ref=e48]: Hold the connective tissue across Alliances, Sales, Marketing, and the Partnerships org to align the partner activation program with Anthropic’s broader partner strategy — this role is the integration point that reduces duplication and resolves channel conflict, not a parallel partner function
              - listitem [ref=e49]:
                - paragraph [ref=e50]: Serve as the internal authority on partner-led activation; represent the programmatic outcomes perspective in partner strategy discussions
            - heading "You may be a good fit if you have:" [level=2] [ref=e51]:
              - strong [ref=e52]: "You may be a good fit if you have:"
            - list [ref=e53]:
              - listitem [ref=e54]:
                - paragraph [ref=e55]: 10+ years in enterprise partner development, channel strategy, or alliances with direct ownership of a partner ecosystem that drove measurable revenue or adoption outcomes
              - listitem [ref=e56]:
                - paragraph [ref=e57]: Experience shaping a partner certification or enablement program — ideally by extending an existing partner ecosystem with new enablement and certification layers, not just managing an inherited program
              - listitem [ref=e58]:
                - paragraph [ref=e59]: Track record of designing partner-led motions that translated into repeatable, scalable adoption outcomes — not just co-sell programs or deal registration schemes
              - listitem [ref=e60]:
                - paragraph [ref=e61]: "Deep understanding of the SI, consulting firm, and MSP landscape: who the high-leverage players are, how they make money, and how to align incentives with Anthropic's activation goals"
              - listitem [ref=e62]:
                - paragraph [ref=e63]: "Cross-functional fluency: comfortable at the intersection of Sales, CS, Product, and Marketing — able to resolve channel conflict constructively and commercially"
              - listitem [ref=e64]:
                - paragraph [ref=e65]: Ability to treat the partner ecosystem as a product — designing it, iterating on it, measuring it, and making portfolio investment decisions with rigorous judgment
