            - generic [ref=e233]:
              - generic [ref=e235]:
                - generic [ref=e236]: Why Anthropic?*
                - textbox "Why Anthropic?" [ref=e237]: "I've spent the last decade building partnership ecosystems from zero, and this role is exactly the kind of problem I get excited about. At i2o Retail, I was the first partnerships hire. I designed the entire partner function: archetypes, onboarding frameworks, enablement programs, incentive structures, and attribution systems. I closed ~$500K in new ARR and built $350K+ in pipeline across enterprise accounts like Nestle, Speedo, and Panasonic. The key insight was figuring out which partner behaviors actually drove value, then building repeatable motions around them. That's exactly what the Marketplace Ecosystem Lead role calls for. At Profitero (acquired by Publicis Groupe), I built a value-added reseller program from nothing to $400K ARR with a $3M+ pipeline in year one. I improved mid-market retention from ~50% to ~90% by integrating service delivery through agency partners. Post-acquisition, I ran cross-functional workstreams between Profitero and Publicis on global pipelines and joint opportunities. At Amobee, I launched global advertising channels (Audio, CTV, DOOH) and grew PMP revenue 300% YoY. What draws me to Anthropic specifically is the stage. Claude Marketplace is early enough that the commercial motion needs to be designed alongside the product, and that's what I do best. I'm not someone who optimizes an existing program. I build the machine: the incentives, the playbooks, the partner tiers, the co-sell motions, the feedback loops back into product. I've done it three times across different industries, and I'm ready to do it at the company that's defining how AI gets deployed in the enterprise. I'm also a product-minded builder. I've shipped multiple SaaS platforms as a founder, hold two utility patents (filed pro se, one allowed by the USPTO), and I spec product architectures regularly. I understand how products get built from the inside, which means I can be a credible voice of the customer into the Marketplace team and collaborate with Product and Engineering as a peer. The combination of Anthropic's mission, the zero-to-one nature of this role, and the chance to shape how an AI ecosystem gets built is exactly what I'm looking for."
              - paragraph [ref=e240]: Why do you want to work at Anthropic? (We value this response highly - great answers are often 200-400 words.)
