            - heading "About Anthropic" [level=2] [ref=e24]:
              - strong [ref=e25]: About Anthropic
            - paragraph [ref=e26]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=e27]:
            - heading "About the role" [level=2] [ref=e28]
            - paragraph [ref=e29]: We're looking for an Ecosystem Lead to help build the future of Claude Marketplace. Marketplace connects Claude-powered enterprise tools through technology partnerships and deeper customer relationships, and we need to build the commercial motion alongside the product to be successful. In this role, you’ll build and design how Claude Marketplace goes to market to drive Marketplace’s growth across sellers, partners, and marketing, and make sure it’s part of a cohesive offering for Anthropic’s ecosystem. You’ll figure out the right incentives to drive the right behaviors across the ecosystem to spin the flywheel while being hands on across partners and customers in the field.
            - paragraph [ref=e30]: This role sits at the intersection of GTM strategy, ecosystem building, and business development. You'll own a portfolio of strategic partners while building the playbooks and incentives to enable Marketplace to truly scale. It's a great fit for someone who enjoys building from the ground up, navigating ambiguity, and thinking creatively.
            - heading "Responsibilities:" [level=2] [ref=e31]:
              - strong [ref=e32]: "Responsibilities:"
            - list [ref=e33]:
              - listitem [ref=e34]: Define the Marketplace go-to-market motion end to end, in close collaboration with sales, partnerships, marketing, and finance, to help build Anthropic’s nascent ecosystem
              - listitem [ref=e35]: Collaborate with commercial teams to drive transaction volume directly with Marketplace partners and Anthropic customers.
              - listitem [ref=e36]: Figure out what drives the right behaviors across partners and sellers and work cross-functionally to build these into repeatable motions and playbooks that can scale to drive adoption of Marketplace transactions across more surfaces and customers
              - listitem [ref=e37]: Be the voice of the customer (and the field) into the Marketplace team to continually improve the offering and provide more value to all parties
              - listitem [ref=e38]: Own a focused portfolio of strategic Marketplace partners, from continually evaluating partners in accordance with Marketplace priorities to structuring and negotiating partnership agreements. Collaborate with Product, Sales, Marketing, Finance, and Legal to align on deal terms, coordinate technical and commercial workstreams, and ensure smooth handoffs post-signature
              - listitem [ref=e39]: Build and maintain relationships with senior business development, product, and partnership leaders at target companies, and support executive-level engagement
            - heading "You may be a good fit if you have:" [level=2] [ref=e40]
            - list [ref=e41]:
              - listitem [ref=e42]: 5+ years of experience in business development, partnerships, channel development or related commercial roles at enterprise technology companies
              - listitem [ref=e43]: 12+ years of experience in commercial roles overall
              - listitem [ref=e44]: Experience designing or operating a co-sell motion, partner program, or channel
              - listitem [ref=e45]: Solid understanding of enterprise SaaS business models, platform economics, and how B2B technology ecosystems worktrong strategic thinking and the ability to operate with limited structure — identifying opportunities, building a plan, and executing without a predefined playbook
              - listitem [ref=e46]: Comfort working in a fast-moving, high-growth environment where priorities shift, and making judgment calls with incomplete information
              - listitem [ref=e47]: A track record of structuring and closing partnership deals that go beyond standard contracts — joint go-to-market, product integrations, revenue sharing, or similar multi-component agreements
            - heading "Strong candidates may also have:" [level=2] [ref=e48]
            - list [ref=e49]:
              - listitem [ref=e50]: Experience with AI/ML platform partnerships or developer ecosystem programs
              - listitem [ref=e51]: Time at a high-growth enterprise software company during a period of rapid scale, particularly in partnerships or ecosystem roles
              - listitem [ref=e52]: Familiarity with foundational AI model capabilities and how enterprises are adopting AI, with a sense for how technical capabilities translate to business value
              - listitem [ref=e53]: Experience at a cloud hyperscaler, ISV marketplace (AWS/GCP/Azure Marketplace, Salesforce AppExchange), or platform company with a co-sell motion — you've seen how the machine works from the inside
              - listitem [ref=e54]: Background in GTM strategy, revenue operations, or partner programs where you owned the outcomes
              - listitem [ref=e55]: Time in a seat where you had to make a program work before the product fully supported it
