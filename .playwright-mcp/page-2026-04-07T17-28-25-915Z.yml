        - generic [ref=e22]:
          - generic [ref=e23]:
            - heading "About the opportunity" [level=2] [ref=e24]
            - paragraph [ref=e25]: Contentful is seeking a director-level leader to own and scale our marketplace and ecosystem strategy within the Corporate Development & Strategy organization. Reporting into our VP of Corporate Development & Strategy, this role will focus on aligning our ISV partner strategy with our broader Product and GTM strategy, building and growing the ISV partner ecosystem, and making it easier for customers and the field to realize value from our ecosystem.
            - paragraph [ref=e26]: You will partner closely with Product, Product Marketing, and the Field to define where ISVs add the most value, recruit and enable the right partners, and ensure our marketplace becomes a meaningful differentiator in customer evaluations and expansion.
            - paragraph [ref=e27]:
              - strong [ref=e28]: This is a hybrid role where office attendance in Denver is expected 2-3 days per week.
            - heading "What to expect?" [level=2] [ref=e29]
            - paragraph [ref=e30]:
              - strong [ref=e31]: ISV partner ecosystem leadership
            - list [ref=e32]:
              - listitem [ref=e33]: Develop and execute a strategy to grow and optimize the ISV partner ecosystem, with clear priorities by use case, segment, and region.
              - listitem [ref=e34]: Recruit, evaluate, and onboard independent software vendors into the Contentful app marketplace.
              - listitem [ref=e35]: "Operate and continuously improve a technology partner program that includes:"
              - list [ref=e36]:
                - listitem [ref=e37]: Outbound partner marketing and recruitment motions to attract ISVs.
                - listitem [ref=e38]: Business development motions focused on getting target ISVs engaged and building.
                - listitem [ref=e39]: Solutions architecture / developer support in partnership with Product and SEs to help ISVs ship high-quality integrations quickly.
                - listitem [ref=e40]: Commercial constructs that support mutual growth (e.g., lead sharing, joint marketing, co-selling, and appropriate economic structures).
              - listitem [ref=e41]: Partner with Product Management and Partner Marketing to identify, recruit, and enable high-impact ISVs aligned to Contentful’s roadmap and key customer needs.
              - listitem [ref=e42]: Identify and prioritize ISVs in key verticals (e.g., retail / commerce, financial services, media) where Contentful sees strong demand.
              - listitem [ref=e43]: Run outbound campaigns in partnership with Marketing and the Field to engage and onboard top vertical ISVs into the marketplace.
              - listitem [ref=e44]: Ensure vertical ISV solutions are packaged and positioned in a way that’s easy for Sales and customers to understand and adopt.
              - listitem [ref=e45]: Drive building out GTM motions for strategic ISV partners (e.g., co-sell / re-sell) from identification through to launch (hand off to Partnership org for execution)
            - paragraph [ref=e46]:
              - strong [ref=e47]: App marketplace growth
            - list [ref=e48]:
              - listitem [ref=e49]: Own marketplace health and growth metrics (e.g., app coverage by use case, install / adoption rates, usage by segment).
              - listitem [ref=e50]: "Collaborate with Product Marketing and Partner Marketing to:"
              - list [ref=e51]:
                - listitem [ref=e52]: Launch and promote priority integrations and solution bundles.
                - listitem [ref=e53]: Build customer-facing stories and case studies that feature key apps and marketplaces use cases.
              - listitem [ref=e54]: "Partner with Customer Success, Sales, and Solution Engineering to:"
              - list [ref=e55]:
                - listitem [ref=e56]: Make it easy for account teams to understand which apps matter, when, and why.
                - listitem [ref=e57]: Incorporate marketplace solutions into sales plays and customer success motions.
              - listitem [ref=e58]: Use data to show how marketplace usage correlates with customer value, satisfaction, and retention, and recommend iterative improvements.
            - paragraph [ref=e59]:
              - strong [ref=e60]: Team and stakeholder leadership
            - list [ref=e61]:
              - listitem [ref=e62]: Lead and mentor a small team focused on ISV and marketplace success (e.g., technology alliance managers and/or product ecosystem roles).
              - listitem [ref=e63]:
                - text: "Drive tight alignment with:"
                - list [ref=e64]:
                  - listitem [ref=e65]: Product and Engineering on integration standards, roadmap fit, and technical quality.
                  - listitem [ref=e66]: Product Marketing and Marketing on messaging, launch plans, and campaigns.
                  - listitem [ref=e67]: Sales, Customer Success, and Solution Engineering on where and how to use ISVs to win and expand deals.
                  - listitem [ref=e68]: Partnership org for execution of strategic partnerships
                  - listitem [ref=e69]: Represent Contentful’s marketplace and ISV ecosystem with partners and at select industry events, helping strengthen our position with key platforms and alliances.
            - paragraph [ref=e70]:
              - strong [ref=e71]: Expected outcomes
            - paragraph [ref=e72]: "Within 12–18 months in role, success looks like:"
            - list [ref=e73]:
              - listitem [ref=e74]:
                - list [ref=e75]:
                  - listitem [ref=e76]: A refreshed ISV and marketplace program that is clearly understood internally and externally (who we target, what we offer, how we work with partners).
                  - listitem [ref=e77]:
                    - text: "Material growth in:"
                    - list [ref=e78]:
                      - listitem [ref=e79]: Number of high-quality apps in the marketplace in priority categories.
                      - listitem [ref=e80]: Adoption and usage of those apps by customers.
                      - listitem [ref=e81]: Contribution of ISV-influenced and ISV-sourced opportunities to pipeline and revenue.
                  - listitem [ref=e82]: Clear, repeatable patterns for how the Field uses ISVs and apps to differentiate Contentful and solve customer problems.
                  - listitem [ref=e83]: Strong, durable relationships with a core set of strategic ISVs that see Contentful as a priority platform.
            - paragraph [ref=e84]:
              - strong [ref=e85]: Required competencies
            - list [ref=e86]:
              - listitem [ref=e87]: "Program and ecosystem leadership:"
              - list [ref=e88]:
                - listitem [ref=e89]: Experience building or scaling a partner program (ideally ISV / marketplace) in a SaaS or enterprise technology company.
                - listitem [ref=e90]: "Ability to balance strategy and execution: defining the model while also running day-to-day partner motions."
              - listitem [ref=e91]: "Sales and business development:"
              - list [ref=e92]:
                - listitem [ref=e93]: Track record of recruiting partners and building a healthy partner pipeline.
                - listitem [ref=e94]: Comfort engaging with partner sales and GTM leaders to align on joint go-to-market plans.
              - listitem [ref=e95]: "Cross-functional leadership:"
              - list [ref=e96]:
                - listitem [ref=e97]: Demonstrated ability to work across Product, Marketing, Sales, and Customer Success to land and scale partnership initiatives.
                - listitem [ref=e98]: Strong stakeholder management and communication skills, including with senior leaders and external executives.
              - listitem [ref=e99]: "Strategic ecosystem thinking:"
              - list [ref=e100]:
                - listitem [ref=e101]: Ability to understand where partners add the most value across the customer lifecycle and prioritize accordingly.
                - listitem [ref=e102]: Experience using data and customer feedback to refine partner and marketplace strategy.
            - heading "What do you need to be successful?" [level=2] [ref=e103]
            - list [ref=e104]:
              - listitem [ref=e105]: 8+ years of experience in technology partnerships, business development, or ecosystem roles in SaaS or enterprise software.
              - listitem [ref=e106]: Direct experience working with independent software vendors and/or app marketplaces (e.g., recruiting, enabling, and growing ISV relationships).
              - listitem [ref=e107]: Experience working closely with Product and Engineering teams on integration requirements and partner enablement.
              - listitem [ref=e108]: Experience partnering with Product Marketing, Marketing, and Field teams on joint messaging, launches, and go-to-market plays.
              - listitem [ref=e109]: Comfortable operating in a fast-moving environment, with the ability to iterate quickly based on partner, customer, and internal feedback.
              - listitem [ref=e110]: Strong written and verbal communication skills and the ability to represent Contentful externally with partners and customers.
              - listitem [ref=e111]: Bachelor’s degree in business, technology, or a related field (or equivalent practical experience).
            - heading "What's in it for you?" [level=2] [ref=e112]
            - list [ref=e113]:
              - listitem [ref=e114]: Join an ambitious tech company reshaping the way people build digital experiences
              - listitem [ref=e115]: Full-time employees receive Stock Options for the opportunity to share in the success of our company
              - listitem [ref=e116]: Comprehensive healthcare package covering 100% of monthly health premiums for employees and 85% of costs for your dependents.
              - listitem [ref=e117]: Fertility and family building benefits, including a lifetime reimbursable wallet to support your growing family.
              - listitem [ref=e118]:
                - text: We value
                - strong [ref=e119]: Work-Life balance
                - text: and
                - strong [ref=e120]: You Time
                - text: "!"
                - strong [ref=e121]
                - text: A generous amount of paid time off, including vacation days, sick days, compassion days for loss, education days, and volunteer days
              - listitem [ref=e122]:
                - strong [ref=e123]: Company paid parental leave
                - text: to care for and focus on your growing family
              - listitem [ref=e124]: Use your personal annual education budget to improve your skills and grow in your career
              - listitem [ref=e125]: Enjoy a full range of virtual and in-person events, including workshops, guest speakers, and fun team activities, supporting learning and networking exchange beyond the usual work duties
              - listitem [ref=e126]: An annual wellbeing stipend to care for your physical, financial, or emotional health
              - listitem [ref=e127]: A monthly communication stipend and phone hardware upgrade reimbursement.
              - listitem [ref=e128]: New hire office equipment stipend for hybrid or distributed employees. Get the gear you need to work at your best.
            - paragraph [ref=e129]:
              - emphasis [ref=e130]: This role will need to be conducted in a state in which we are currently registered to do business. In addition, this position is
              - strong [ref=e131]:
                - emphasis [ref=e132]: not
              - emphasis [ref=e133]: eligible for visa sponsorship. Applicants must be authorized to work without the need for visa sponsorship by the start date of employment.
            - paragraph [ref=e134]: This position is eligible for equity awards in accordance with the terms of Contentful’s equity plans.
            - paragraph [ref=e135]: The application deadline is 05/17/2026
            - paragraph [ref=e136]: "Colorado Salary Statement: The salary range displayed is specifically for those potential hires who will work or reside in the state of Colorado if selected for the role. Any offered salary is determined based on internal equity, internal salary ranges, market data/ranges, applicant's skills and prior relevant experience, certain degrees and certifications (e.g. JD/technology), for example."
            - paragraph [ref=e137]: "Colorado Salary: $240,000- $276,000"
