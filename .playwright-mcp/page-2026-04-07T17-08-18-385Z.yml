                - generic [ref=e204]: How are you using AI today in your current role? If applicable, show us your last AI experiment.*
                - textbox "How are you using AI today in your current role? If applicable, show us your last AI experiment." [ref=e205]: "AI is central to how I work today, both in my day job and in the products I build. At i2o Retail, I designed the Retail Media Risk Index (RMRI), an AI-powered scoring framework that benchmarks brand risk across Buy Box integrity, search hijacking, price compression, and catalog pollution. I authored the thesis, designed the scoring models (v1 and v2), and led the go-to-market strategy. It started as a partner enablement tool and became a standalone data product. On the product side, I've built multiple AI-powered platforms: a real estate valuation platform with explainable scoring models and adaptive search (two utility patents filed pro se, one allowed by the USPTO, one pending); a quantitative prediction market platform with a proprietary ML pricing engine (LightGBM ensemble, Venn-ABERS calibration, fair value estimation); and an AI-powered meal planning tool for a physician-led weight management practice. My most recent AI experiment: I built an end-to-end job search automation pipeline using Claude Code. It evaluates job descriptions against my profile, generates tailored CVs, scans career portals, batch-processes applications, and tracks everything in a structured pipeline. The system evaluates fit across six dimensions, generates personalized interview prep, and outputs ATS-optimized PDFs. GitHub: github.com/santifer/career-ops I approach AI as a product-minded builder. I spec architectures, design systems, and ship working products using AI-assisted development. I don't just use AI tools; I understand how they work well enough to design partner enablement programs around them."
