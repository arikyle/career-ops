        - generic [ref=e20]:
          - paragraph [ref=e22]: Airtable is the no-code app platform that empowers people closest to the work to accelerate their most critical business processes. More than 500,000 organizations, including 80% of the Fortune 100, rely on Airtable to transform how work gets done.
          - generic [ref=e23]:
            - paragraph [ref=e24]: Services and alliance partners are a critical part of the Airtable customer journey, helping clients drive business transformation with Airtable through discovery, solution design, implementation, change management, project management, integrations, training and ongoing support. They are instrumental in unlocking the full potential of the Airtable platform for existing and potential customers.
            - paragraph [ref=e25]: As the Head of Partnerships, you will be guiding delivery partner strategy, leading a partnership team, overseeing the global partner ecosystem, and collaborating with cross-functional teams to drive partner success.
            - heading "What you'll do" [level=2] [ref=e26]
            - list [ref=e27]:
              - listitem [ref=e28]: Build and scale a global ecosystem of consulting partners and System Integrators (SIs) with the right strategic, technical and service capabilities to drive customer projects in the Enterprise
              - listitem [ref=e29]: Develop and nurture strategic alliances with key ISV’s and Hyperscalers
              - listitem [ref=e30]: Define and communicate the long-term vision and strategy for the partner & alliance organization
              - listitem [ref=e31]: Develop systematic, AI-centric processes to develop an end-to-end partner program with a focus on partner identification, partner qualification, enablement/training, certification, partner success, client success and partner capability expansion (i.e. partners that enable customers to become agentic enterprises)
              - listitem [ref=e32]: Develop regional partner plans, with a list of target consulting partners and tech alliances based upon customer and Airtable needs, capabilities and Airtable capacity
              - listitem [ref=e33]: Collaborate with Marketing to promote customer engagements and consulting/alliance partners
              - listitem [ref=e34]: Partner closely with Sales, Customer Success and Services on customer opportunities aligning the right partner for specific engagements
              - listitem [ref=e35]: Build and oversee partner consultant delivery oversight, subcontracting, and collaborate with the Services team on engagement models
              - listitem [ref=e36]: Maintain quality assurance oversight to ensure ongoing partner technical build success
              - listitem [ref=e37]: Develop and refine partner tiering structures, certification programs, and co-selling initiatives to ensure high quality
              - listitem [ref=e38]: Lead a team of regional partner managers to ensure consistent execution of partner strategies globally
              - listitem [ref=e39]: Inform partner onboarding and enablement initiatives, in coordination with the Services enablement team, to include training, certifications, and QA
            - heading "Who you are" [level=2] [ref=e40]
            - list [ref=e41]:
              - listitem [ref=e42]: 5-10+ years leadership experience in partnerships or professional services, with an emphasis on managing services / solutions / alliance partnerships across B2B SaaS and/or AI-native platforms
              - listitem [ref=e43]: Experience managing a global partner ecosystem for companies with at least $100M ARR
              - listitem [ref=e44]: Ability to think strategically while executing operationally in a fast-paced environment
              - listitem [ref=e45]: Can navigate highly strategic and complex partnerships and drive co-selling with our internal teams with a track record of cross functional coordination and alignment
              - listitem [ref=e46]: Ability to prioritize based on both quantitative and qualitative analysis
              - listitem [ref=e47]: Ability to build and drive partner plans on an ongoing cadence to achieve business goals
              - listitem [ref=e48]: Experience fostering and implementing strategic SI partnerships within Big-5 consulting
              - listitem [ref=e49]: Systems thinker who leverages AI to develop end-to-end processes that focus on achieving optimal outcomes, versus simply adding human headcount
            - paragraph [ref=e50]:
              - text: Airtable is an equal opportunity employer. We embrace diversity and strive to create a workplace where everyone has an equal opportunity to thrive. We welcome people of different backgrounds, experiences, abilities, and perspectives. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, protected veteran status or any characteristic protected by applicable federal and state laws, regulations and ordinances. Learn more about your
              - link "EEO rights as an applicant" [ref=e51] [cursor=pointer]:
                - /url: https://drive.google.com/file/d/1jAj2by1bto5g8Xqn9hWNAwPOMGNd_fM6/view?usp=sharing
              - strong [ref=e52]: .
            - paragraph [ref=e53]: VEVRAA-Federal Contractor
            - paragraph [ref=e54]:
              - text: If you have a medical condition, disability, or religious belief/practice which inhibits your ability to participate in any part of the application or interview process, please complete our
              - link "Accommodations Request Form" [ref=e55] [cursor=pointer]:
                - /url: https://airtable.com/shrq13fCV8h1sx2t8
              - text: and let us know how we may assist you. Airtable is committed to participating in the interactive process and providing reasonable accommodations to qualified applicants.
