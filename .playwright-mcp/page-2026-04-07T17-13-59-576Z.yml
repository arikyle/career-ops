            - generic [ref=e303]:
              - generic [ref=e304]: What excites you most about this opportunity?
              - textbox "What excites you most about this opportunity?" [ref=e305]: "The chance to build a category-defining partner ecosystem at an AI-first company. I've built partnerships functions from zero three times (i2o Retail, Profitero, Amobee), and each time the challenge was the same: how do you turn partner relationships into a reliable, scalable revenue channel? Intercom's Fin agent changes the game for customer service, and the partner ecosystem needs to match that ambition. I want to be the person who designs that system: the operating model, the tiering, the enablement, the co-selling motions that make Intercom's partners as effective as your direct team. The executive visibility and cross-functional scope of this role is exactly where I do my best work."
            - generic [ref=e308]:
              - generic [ref=e309]: Which Intercom value resonates most with you and why? (Our values can be found on our Careers Page)
              - textbox "Which Intercom value resonates most with you and why? (Our values can be found on our Careers Page)" [ref=e310]: "\"We go further together.\" Every partnership function I've built has been about multiplying impact through other people and organizations. At i2o, I didn't just close deals; I designed a system where partners could independently drive adoption and revenue. At Profitero, the VAR program turned agency partners into the delivery layer that fixed our retention problem (50% to 90%). The best partnerships work is fundamentally collaborative: you succeed by making your partners successful. That's going further together in practice."
