        - generic [ref=e21]:
          - generic [ref=e22]:
            - paragraph [ref=e23]: Intercom is the AI Customer Service company on a mission to help businesses provide incredible customer experiences.
            - paragraph [ref=e24]: Our AI agent Fin, the most advanced customer service AI agent on the market, lets businesses deliver always-on, impeccable customer service and ultimately transform their customer experiences for the better. Fin can also be combined with our Helpdesk to become a complete solution called the Intercom Customer Service Suite, which provides AI enhanced support for the more complex or high touch queries that require a human agent.
            - paragraph [ref=e25]: Founded in 2011 and trusted by nearly 30,000 global businesses, Intercom is setting the new standard for customer service. Driven by our core values, we push boundaries, build with speed and intensity, and consistently deliver incredible value to our customers.
          - generic [ref=e26]:
            - heading "What's the opportunity?" [level=2] [ref=e27]
            - paragraph [ref=e28]: We’re hiring a Head of Global Partnerships to lead, scale, and evolve this function. This role owns the end-to-end partnerships charter, including ecosystem strategy, partner acquisition and enablement, go-to-market execution, and revenue impact. You will report to the SVP of Sales, be a key member of the GTM leadership team, and work cross-functionally with senior leaders in Product, Sales, Marketing, and Customer Success.
            - paragraph [ref=e29]: This is a unique opportunity to build a category-defining partner ecosystem that fuels both Intercom’s and our partners’ success. This role is pivotal to how Intercom scales with and through the ecosystem. You’ll play a critical role in shaping our go-to-market future, unlocking new revenue channels, and amplifying our product and brand in the market. You’ll lead a strategic function with executive visibility, operate at the intersection of GTM and product, and help define what best-in-class partnerships look like in the AI-first customer service era.
            - heading "What will I be doing?" [level=2] [ref=e30]
            - heading "Executive Leadership & Organizational Scale" [level=4] [ref=e31]
            - list [ref=e32]:
              - listitem [ref=e33]: Lead, mentor, and grow the global partnerships organization across Solutions, Technology, and Strategic partnerships.
              - listitem [ref=e34]: Establish a clear operating model, org structure, and growth strategy to evolve the evolution of Intercom’s partner ecosystem.
              - listitem [ref=e35]: Build deep alignment with Sales, Marketing, Product, Engineering, and Customer Success to embed partnerships into the broader GTM engine.
              - listitem [ref=e36]: Represent Partnerships at the executive level, providing strategic recommendations, business insights, and market intelligence.
            - heading "Partnership Strategy & Ecosystem Design" [level=4] [ref=e37]
            - list [ref=e38]:
              - listitem [ref=e39]: Define and own Intercom’s global partnership strategy, ensuring clear priorities, execution focus, and measurable outcomes across all partner categories.
              - listitem [ref=e40]: Articulate a differentiated and scalable ecosystem vision aligned to Intercom’s long-term growth priorities.
              - listitem [ref=e41]: Evaluate market trends and competitive landscapes to identify new partnership categories, ecosystem opportunities, and strategic alliances.
            - heading "Program Development & Scalable Infrastructure" [level=4] [ref=e42]
            - list [ref=e43]:
              - listitem [ref=e44]: Design and operationalize scalable partner programs including onboarding, enablement, certification, incentives, and co-selling frameworks.
              - listitem [ref=e45]: Build the infrastructure (systems, tools, partner portal, analytics) to support consistent, high-impact partner engagement at scale.
              - listitem [ref=e46]: Establish partner tiering, accountability frameworks, and performance metrics to drive sustained results.
            - heading "Partner Acquisition, Management & Revenue Growth" [level=4] [ref=e47]
            - list [ref=e48]:
              - listitem [ref=e49]: "Source, evaluate, and secure high-impact partners across all segments: Solutions, Technology, and Strategic partners."
              - listitem [ref=e50]: Lead executive-level relationships with top partners to unlock co-selling, co-marketing, and integration opportunities to drive ARR.
              - listitem [ref=e51]: Develop and scale repeatable partner motions that integrate partners into the sales cycle and influence product strategy.
              - listitem [ref=e52]: Drive measurable business outcomes through partner-sourced and partner-influenced revenue.
            - heading "What skills do I need?" [level=2] [ref=e53]
            - list [ref=e54]:
              - listitem [ref=e55]: 12+ years experience in Partnerships, Business Development, Alliances, or Ecosystem Leadership within SaaS or enterprise technology.
              - listitem [ref=e56]: Proven success building and scaling a global partnerships organization, including hiring, team design, and performance management.
              - listitem [ref=e57]: "Experience developing and operationalizing partner programs across multiple partner types: Solutions, Technology, and Strategic."
              - listitem [ref=e58]: Strong operational mindset. Able to design processes, define KPIs, build systems, and implement scalable partner motions.
              - listitem [ref=e59]: Track record of delivering revenue impact through partner-sourced and partner-influenced pipeline.
              - listitem [ref=e60]: Excellent executive presence with the ability to influence senior stakeholders internally and externally.
              - listitem [ref=e61]: Exceptional relationship-building and negotiation skills.
            - heading "Benefits" [level=2] [ref=e62]
            - paragraph [ref=e63]: We are a well-treated bunch, with awesome benefits! If there’s something important to you that’s not on this list, talk to us!
            - list [ref=e64]:
              - listitem [ref=e65]: Competitive salary and meaningful equity
              - listitem [ref=e66]: Comprehensive medical, dental, and vision coverage
              - listitem [ref=e67]: Regular compensation reviews - great work is rewarded!
              - listitem [ref=e68]: Flexible paid time off policy
              - listitem [ref=e69]: Paid Parental Leave Program
              - listitem [ref=e70]: 401k plan & match
              - listitem [ref=e71]: In-office bicycle storage
              - listitem [ref=e72]: Fun events for Intercomrades, friends, and family!
            - paragraph [ref=e73]: The OTE range for candidates within the San Francisco Bay Area is $399,600-$477,300. Actual base pay will depend on a variety of factors such as education, skills, experience, location, etc. The base pay range is subject to change and may be modified in the future. All regular employees may also be eligible for the corporate bonus program or a sales incentive (target included in OTE) as well as stock in the form of Restricted Stock Units (RSUs).
            - paragraph [ref=e74]: "#LI-Hybrid"
          - generic [ref=e75]:
            - paragraph [ref=e76]:
              - strong [ref=e77]: Policies
            - paragraph [ref=e78]: Intercom has a hybrid working policy. We believe that working in person helps us stay connected, collaborate easier and create a great culture while still providing flexibility to work from home. We expect employees to be in the office at least three days per week.
            - paragraph [ref=e79]:
              - text: We have a radically open and accepting culture at Intercom. We avoid spending time on divisive subjects to foster a safe and cohesive work environment for everyone. As an organization, our policy is to not advocate on behalf of the company or our employees on any social or political topics out of our internal or external communications. We respect personal opinion and expression on these topics on personal social platforms on personal time, and do not challenge or confront anyone for their views on non-work related topics. Our goal is to focus on doing incredible work to achieve our goals and unite the company through our
              - link "core values" [ref=e80] [cursor=pointer]:
                - /url: https://www.intercom.com/careers
              - text: .
            - paragraph [ref=e81]: Intercom values diversity and is committed to a policy of Equal Employment Opportunity. Intercom will not discriminate against an applicant or employee on the basis of race, color, religion, creed, national origin, ancestry, sex, gender, age, physical or mental disability, veteran or military status, genetic information, sexual orientation, gender identity, gender expression, marital status, or any other legally recognized protected basis under federal, state, or local law.
