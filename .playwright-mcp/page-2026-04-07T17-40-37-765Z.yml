        - generic [ref=e22]:
          - paragraph [ref=e24]:
            - superscript [ref=e26]: PolyAI automates customer service through lifelike voice assistants that let customers lead a conversation. Our voice assistants make it possible for businesses to deliver outstanding customer service that rivals their human agents. Our customers, which include the world’s leading logos, are expanding how they use our platform, driving automation of critical customer service operations and integrating PolyAI into their daily customer service workflows.
          - generic [ref=e27]:
            - paragraph [ref=e28]:
              - subscript [ref=e30]: PolyAI is seeking a Senior Manager, ISV Partnerships & GTM to drive revenue growth by building and scaling partnerships with Independent Software Vendors. This is a business development role at its core — you will identify ISV partners whose products and customer base create natural distribution channels for PolyAI, structure partnerships that get PolyAI bundled or integrated into their offerings, and execute joint go-to-market strategies that generate measurable pipeline and bookings.
            - paragraph [ref=e31]:
              - subscript [ref=e33]: "You will own a portfolio of 5–10 ISV partnerships across up to five verticals. Some of these verticals are established — hospitality, fintech, and banking — where PolyAI has proven traction and named enterprise customers. Others are greenfield: verticals where voice AI has clear applicability but PolyAI has not yet built a partner-led presence. A major part of this role is identifying which new verticals to pursue, validating the opportunity through ISV partnerships, and building the go-to-market playbook from scratch."
            - paragraph [ref=e34]:
              - subscript [ref=e36]:
                - text: This is a quota-carrying role. You will report to the
                - strong [ref=e37]: VP of Alliances
                - text: .
            - heading "What You’ll Do" [level=2] [ref=e38]:
              - subscript [ref=e40]:
                - strong [ref=e41]: What You’ll Do
            - heading "ISV Partner Acquisition & Business Development" [level=3] [ref=e42]:
              - subscript [ref=e44]:
                - strong [ref=e45]: ISV Partner Acquisition & Business Development
            - list [ref=e46]:
              - listitem [ref=e47]:
                - subscript [ref=e49]: Source, evaluate, and recruit ISV partners whose products and customer base align with PolyAI’s voice AI platform — across both proven and emerging verticals
              - listitem [ref=e50]:
                - subscript [ref=e52]: "Build the business case for each partnership: how PolyAI integrates into the ISV’s product, what the joint value proposition looks like for the end customer, and where the revenue opportunity sits"
              - listitem [ref=e53]:
                - subscript [ref=e55]: Negotiate partnership terms including co-sell frameworks, referral structures, integration commitments, and joint success metrics
              - listitem [ref=e56]:
                - subscript [ref=e58]: Develop multi-threaded relationships across ISV organizations — from product and engineering teams to sales leadership and executive sponsors
            - heading "Go-to-Market Strategy & Execution" [level=3] [ref=e59]:
              - subscript [ref=e61]:
                - strong [ref=e62]: Go-to-Market Strategy & Execution
            - list [ref=e63]:
              - listitem [ref=e64]:
                - subscript [ref=e66]: Develop and execute joint GTM plans with each ISV partner, including co-selling motions, demand generation campaigns, joint events, and co-branded content
              - listitem [ref=e67]:
                - subscript [ref=e69]: Work with ISV partner sales teams to drive pipeline creation, deal acceleration, and closed revenue through co-sell and referral activity
              - listitem [ref=e70]:
                - subscript [ref=e72]: Collaborate with PolyAI Marketing to build joint value propositions, case studies, and campaign assets that support partner-led pipeline generation
              - listitem [ref=e73]:
                - subscript [ref=e75]: Manage pipeline and booking targets directly tied to ISV partner activity
            - heading "Vertical Expansion & Market Development" [level=3] [ref=e76]:
              - subscript [ref=e78]:
                - strong [ref=e79]: Vertical Expansion & Market Development
            - list [ref=e80]:
              - listitem [ref=e81]:
                - subscript [ref=e83]: Analyze market dynamics, customer pain points, and competitive landscape to identify new verticals where voice AI creates compelling value and ISV partnerships provide the fastest path to market
              - listitem [ref=e84]:
                - subscript [ref=e86]: Validate new vertical opportunities through targeted ISV outreach, early partnerships, and pilot engagements that prove demand before committing to full-scale GTM investment
              - listitem [ref=e87]:
                - subscript [ref=e89]: Build repeatable vertical playbooks — including target ISV profiles, integration patterns, and sales enablement materials — that scale across the partner ecosystem
            - heading "Integration Support & Partner Enablement" [level=3] [ref=e90]:
              - subscript [ref=e92]:
                - strong [ref=e93]: Integration Support & Partner Enablement
            - list [ref=e94]:
              - listitem [ref=e95]:
                - subscript [ref=e97]: Work with PolyAI’s Solutions Engineering and Product teams to support ISV integration and onboarding, ensuring technical quality and a smooth path to production
              - listitem [ref=e98]:
                - subscript [ref=e100]: Enable ISV partner teams on PolyAI’s platform capabilities, use cases, and competitive positioning so they can sell effectively alongside or on behalf of PolyAI
              - listitem [ref=e101]:
                - subscript [ref=e103]: Provide feedback from ISV partners to Product and Engineering on integration requirements, feature gaps, and roadmap priorities that would unlock new partnership opportunities
            - heading "Performance Management & Reporting" [level=3] [ref=e104]:
              - subscript [ref=e106]:
                - strong [ref=e107]: Performance Management & Reporting
            - list [ref=e108]:
              - listitem [ref=e109]:
                - subscript [ref=e111]: Track partner-sourced pipeline, influenced revenue, and closed bookings across the ISV portfolio
              - listitem [ref=e112]:
                - subscript [ref=e114]: Run regular business reviews with ISV partners and internal stakeholders to assess performance, refine strategy, and identify growth opportunities
              - listitem [ref=e115]:
                - subscript [ref=e117]: Deliver accurate forecasting and pipeline reporting to leadership
            - heading "The Ideal Candidate" [level=2] [ref=e118]:
              - subscript [ref=e120]:
                - strong [ref=e121]: The Ideal Candidate
            - list [ref=e122]:
              - listitem [ref=e123]:
                - subscript [ref=e125]: 6–8 years of experience in ISV partnerships, channel sales, business development, or alliances — with a track record of sourcing and closing partnership deals that drove measurable revenue
              - listitem [ref=e126]:
                - subscript [ref=e128]: "Quota-carrying experience: you have owned a number and consistently hit it through partner-led or partner-influenced pipeline"
              - listitem [ref=e129]:
                - subscript [ref=e131]: Builder mentality — you have stood up new partnerships, new verticals, or new GTM motions from scratch, not just inherited an existing book of business
              - listitem [ref=e132]:
                - subscript [ref=e134]: "Strong business development instincts: comfortable with outbound prospecting into ISV organizations, navigating complex deal structures, and presenting to executive leadership"
              - listitem [ref=e135]:
                - subscript [ref=e137]: Ability to understand technology products at a level sufficient to evaluate integration fit, participate in technical scoping conversations, and credibly represent PolyAI’s platform to ISV product and engineering teams
              - listitem [ref=e138]:
                - subscript [ref=e140]: Experience in SaaS, enterprise software, or technology partnerships — ideally in contact center, CX, voice, or AI-adjacent markets
              - listitem [ref=e141]:
                - subscript [ref=e143]: "Direct experience in at least one of PolyAI’s established verticals: hospitality, fintech, or financial services"
              - listitem [ref=e144]:
                - subscript [ref=e146]: Highly organized with strong CRM discipline (Salesforce preferred) and a data-driven approach to pipeline management
              - listitem [ref=e147]:
                - subscript [ref=e149]: Self-directed and comfortable operating with significant autonomy in a fast-paced, high-growth environment
            - heading "What Will Make You Stand Out" [level=2] [ref=e150]:
              - subscript [ref=e152]:
                - strong [ref=e153]: What Will Make You Stand Out
            - list [ref=e154]:
              - listitem [ref=e155]:
                - subscript [ref=e157]: Experience building ISV or technology partner programs at a high-growth SaaS company where the partner ecosystem was still being defined
              - listitem [ref=e158]:
                - subscript [ref=e160]: Background in conversational AI, voice AI, contact center technology, or adjacent enterprise software categories
              - listitem [ref=e161]:
                - subscript [ref=e163]: Existing relationships with ISV executives in hospitality technology, fintech, banking software, or other vertical SaaS markets
              - listitem [ref=e164]:
                - subscript [ref=e166]: Experience evaluating and entering new vertical markets through partnership-led GTM strategies
              - listitem [ref=e167]:
                - subscript [ref=e169]: "Familiarity with enterprise integration patterns: APIs, SIP/PSTN telephony, CCaaS platforms, and CRM system interconnection"
            - paragraph [ref=e170]:
              - subscript [ref=e172]:
                - text: We provide a competitive salary range for this role - which is
                - strong [ref=e173]: $190,000-$230,000 OTE
                - text: "- depending on level and experience. Please note this range is intended as a guide, not a guarantee. Final compensation will be based on individual qualifications, relevant experience, and the scope of the role."
            - paragraph [ref=e174]:
              - subscript [ref=e176]: In addition to salary, this position includes equity in the business, giving you the opportunity to share in the company’s long-term success.
