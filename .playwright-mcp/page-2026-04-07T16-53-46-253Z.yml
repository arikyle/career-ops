                - listitem [ref=e385]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=e386]: Intellectual or developmental disability
                - listitem [ref=e387]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=e388]: Missing limbs or partially missing limbs
