                - listitem [ref=e390]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=e391]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=e392]: Partial or complete paralysis (any cause)
                - listitem [ref=e393]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
