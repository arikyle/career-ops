              - generic [ref=e167]: Why are you interested in Runpod? *
              - textbox "Why are you interested in Runpod?" [ref=e168]: "I've built partnerships functions from zero three times — at i2o Retail (first partnerships hire, ~$500K new ARR), Profitero (VAR program from nothing to $400K ARR with a $3M pipeline), and Amobee (global channel launches driving $100M+ in advertising revenue). Each time, I designed the system: partner archetypes, onboarding frameworks, enablement, attribution, and channel conflict resolution. RunPod's role is the exact same playbook at a company I'm genuinely excited about. You're the infrastructure layer powering the next wave of AI — $120M ARR from a standing start in three years is remarkable, and the fact that this growth has been largely organic tells me there's massive latent demand from partners who already want to resell, refer, and integrate RunPod into their solutions. The three pillars in the JD (referral, reseller/marketplace, SIs) map directly to work I've done. I've built referral engines with ecosystem vendors, launched reseller/VAR programs with tiered certification, and worked cross-functionally with GSIs post-Publicis acquisition at Profitero. What makes me different: I'm also a builder. I code (Next.js, React, Python), I spec ML architectures, and I hold two utility patents I filed pro se. When I talk to Product and Engineering about integration health, data contracts, or API design, I speak as a peer — not a translator. For a developer-first platform like RunPod, that technical fluency matters."
