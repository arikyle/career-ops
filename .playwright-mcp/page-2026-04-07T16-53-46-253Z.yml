        - generic [ref=e18]:
          - paragraph [ref=e19]: Runpod is the foundational platform for developers to build and run custom AI systems that scale. With over 500,000 developers worldwide and an annual recurring revenue run rate exceeding $120M, Runpod operates at the intersection of developer velocity and production-scale AI. Founded in 2022, we’ve grown rapidly by building infrastructure purpose-built for modern AI workloads. Our platform enables teams to move from experimentation to deployment with flexibility across cloud, on-prem, and hybrid environments. As a remote-first, globally distributed company, we are building the infrastructure layer that powers the next generation of AI systems.
          - paragraph [ref=e20]: "We are seeking a strategic and execution-oriented Head of Partnerships to join our team. As the first dedicated hire in this function, you will be responsible for systematizing and scaling our existing organic traction into a powerful force multiplier for growth. You will design and lead our partnership ecosystem across three primary pillars: Referral Partners, Reseller/Marketplaces, and System Integrators."
          - heading "Responsibilities:" [level=3] [ref=e21]:
            - strong [ref=e22]: "Responsibilities:"
          - list [ref=e23]:
            - listitem [ref=e24]: "Referral Partner Ecosystem: Identify and recruit complementary vendors in the AI/ML ecosystem (tooling, platforms, and consulting) to build bidirectional referral engines and co-marketing initiatives."
            - listitem [ref=e25]: "Channel Revenue & Marketplaces: Lead our presence in major cloud marketplaces (AWS, Azure, GCP) and manage relationships with technology distributors and VARs to tap into enterprise procurement workflows."
            - listitem [ref=e26]: "System Integrator (SI) Strategy: Build joint solution programs with GSIs and boutique AI consultancies, enabling them to bundle Runpod infrastructure into complete \"AI development lifecycle\" solutions for enterprise customers."
            - listitem [ref=e27]: "Ecosystem Development: Scale partnerships as a force multiplier for growth, allowing Runpod to expand its market reach without proportional headcount expansion."
            - listitem [ref=e28]: "Cross-Functional Collaboration: Work closely with Sales, Product, DevRel and Marketing to ensure partnership leads are seamlessly integrated into our hybrid PLG/SLG motion."
          - paragraph [ref=e29]:
            - strong [ref=e30]: "Requirements:"
          - list [ref=e31]:
            - listitem [ref=e32]: 7+ years of experience in partnerships, business development, or ecosystem growth, with at least 2+ years operating at a senior or leadership level.
            - listitem [ref=e33]: "AI/ML Domain Expertise: Demonstrated understanding of the AI infrastructure market, adjacencies across the dev lifecycle, and the industry broadly."
            - listitem [ref=e34]: "Partnership Experience: Proven track record of managing Cloud Marketplace co-sell motions and building relationships with System Integrators."
            - listitem [ref=e35]: "Execution Focus: A \"player-coach\" mentality, capable of both high-level strategy and hands-on partner recruitment and team management."
            - listitem [ref=e36]: Proven track record of building and scaling strategic partnerships and impact.
            - listitem [ref=e37]: Experience negotiating complex commercial agreements and long‑term strategic deals.
            - listitem [ref=e38]: Ability to operate at both a strategic and hands‑on execution level in a fast‑moving startup environment.
            - listitem [ref=e39]: Excellent communication, presentation, and stakeholder‑management skills.
            - listitem [ref=e40]: Successful completion of a background check.
          - paragraph [ref=e41]:
            - strong [ref=e42]: "What You’ll Receive:"
          - list [ref=e43]:
            - listitem [ref=e44]: The competitive OTE pay for this position ranges from $220,000-300,000 usd. This salary range may be inclusive of several career levels at Runpod and will be narrowed during the interview process based on a number of factors, including the candidate’s experience, qualifications, and location
            - listitem [ref=e45]: Meaningful equity in a fast-growing company- everyone on the team receives stock options — your impact drives our growth, and you share in the upside.
            - listitem [ref=e46]: Generous medical, dental & vision plans — we cover 100% for all employees and partial for dependents.
            - listitem [ref=e47]: Flexible PTO- take the time you need to recharge
            - listitem [ref=e48]: Most roles are remote work first with an inclusive, collaborative teams utilizing slack as the main form of internal communication
            - listitem [ref=e49]: Join a passionate team on the cutting edge of AI infrastructure — where culture, learning, and ownership are at the heart of how we scale.
            - listitem [ref=e50]:
              - text: $1,200 Home Office & Equipment Stipend-
              - strong [ref=e51]
              - text: We set you up for success from day one with gear and support to create your ideal workspace
          - paragraph [ref=e52]: Runpod is committed to maintaining a workplace free from discrimination and upholding the principles of equality and respect for all individuals. We believe that diversity in all its forms enhances our team. As an equal opportunity employer, Runpod is committed to creating an inclusive workforce at every level. We evaluate qualified applicants without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, age, marital status, protected veteran status, disability status, or any other characteristic protected by law. We welcome every qualified candidate eligible to work in the United States; however, we are currently unable to sponsor employment visas
