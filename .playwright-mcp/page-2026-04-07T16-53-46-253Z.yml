                - listitem [ref=e375]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=e376]: Blind or low vision
                - listitem [ref=e377]: Cancer (past or present)
                - listitem [ref=e378]: Cardiovascular or heart disease
